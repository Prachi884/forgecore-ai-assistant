# ─── ForgeCore AI Assistant — Application Settings ───────────
# Stage 1 baseline. We tune these as we progress through the stages.
# Secrets (GEMINI_API_KEY etc.) live in .env, NOT here.

env: development
log_level: INFO

paths:
  raw_docs_dir: ./data/raw
  processed_dir: ./data/processed
  eval_dir: ./data/eval
  vector_db_dir: ./chroma_db

chunking:
  # chunk_size: target tokens per chunk (≈ words × 1.3)
  chunk_size: 500
  # chunk_overlap: shared tokens between consecutive chunks
  chunk_overlap: 50
  # Recursive split order — try paragraph first, then sentence, then word.
  splitter_separators:
    - "\n\n"
    - "\n"
    - ". "
    - " "
    - ""

embeddings:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  dimension: 384
  batch_size: 32
  device: cpu
  # When true, embeddings are L2-normalised so cosine == dot product
  normalize: true

retrieval:
  # How many chunks to return per query
  top_k: 5
  distance_metric: cosine
  collection_name: forgecore_knowledge

llm:
  provider: gemini
  model: gemini-2.0-flash
  temperature: 0.2
  max_output_tokens: 1024
