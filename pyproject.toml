[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgecore-ai-assistant"
version = "0.1.0"
description = "RAG-based AI knowledge assistant for ForgeCore Industries (fictional B2B manufacturer)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "ForgeCore AI Team" },
]
keywords = ["rag", "llm", "ai", "manufacturing", "knowledge-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies — installed via `pip install -e .`
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",          # nicer console output
]

[project.optional-dependencies]
# Dev dependencies — installed via `pip install -e .[dev]`
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
]

# Ingestion extras — added in Stage 2
ingestion = [
    "pymupdf>=1.24.0",
    "reportlab>=4.0.0",
]

# Embeddings + vector DB — added in Stage 3
retrieval = [
    "sentence-transformers>=2.7.0",
    "chromadb>=0.5.0",
]

# LLM client — added in Stage 5
llm = [
    "google-generativeai>=0.8.0",
]

# Streamlit UI — added in Stage 7
ui = [
    "streamlit>=1.37.0",
]

all = [
    "forgecore-ai-assistant[ingestion,retrieval,llm,ui]",
]

[project.scripts]
# After `pip install -e .`, these become shell commands.
forgecore-ingest = "forgecore.ingestion.pipeline:main"
forgecore-build-index = "forgecore.retrieval.vector_store:main"
forgecore-query = "forgecore.rag.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"forgecore" = ["py.typed"]

# ─── Ruff (linter + formatter) ──────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Sensible default rule sets
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # bugbear (likely bugs)
    "UP",  # pyupgrade (modern syntax)
    "N",   # pep8-naming
    "C4",  # comprehensions
]
ignore = [
    "E501",  # line length — handled by formatter
    "B008",  # function calls in defaults — common in FastAPI/pydantic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts are fine in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── Pytest ─────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",            # show extra test summary info
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: unit tests for individual modules",
    "integration: integration tests across modules",
    "slow: slow tests (skipped by default, run with --runslow)",
]

# ─── Coverage ───────────────────────────────────────────────
[tool.coverage.run]
source = ["src/forgecore"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
precision = 2
